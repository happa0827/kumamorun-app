<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://apis.google.com https://www.google.com; frame-src 'self' https://kumamorun-2.firebaseapp.com https://www.google.com https://recaptcha.google.com;"
    />
    <title>Kumamorun - アカウント</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <button id="back" class="btn-back">← 戻る</button>

      <div class="page-title">
        <h1>アカウント</h1>
      </div>

      <div id="auth-form" class="auth-card">
        <div class="field">
          <span class="field-label">メールアドレス</span>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <span class="field-label">パスワード</span>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
        <div class="btn-pair">
          <button id="login" class="btn btn-primary">ログイン</button>
          <button id="signup" class="btn btn-ghost">新規登録</button>
        </div>
      </div>

      <p id="auth-status" class="auth-status">未ログイン</p>
      <button id="logout" class="btn btn-danger btn-block">ログアウト</button>
    </div>
    <script src="bundle.js" defer></script>
  </body>
</html>
