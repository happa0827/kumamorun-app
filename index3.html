<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://apis.google.com https://www.google.com; frame-src 'self' https://kumamorun-2.firebaseapp.com https://www.google.com https://recaptcha.google.com;"
    />
    <title>Kumamorun</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <button id="back" class="btn-back">← 戻る</button>

      <div class="page-title">
        <h1>設定</h1>
      </div>

      <div class="section">
        <span class="section-title">既定の時間</span>
        <div class="field">
          <span class="field-label">遊びの時間（秒）</span>
          <input type="number" id="play-time" placeholder="例: 1200" />
        </div>
        <div class="field">
          <span class="field-label">休憩の時間（秒）</span>
          <input type="number" id="break-time" placeholder="例: 300" />
        </div>
      </div>

      <div class="section">
        <span class="section-title">目の休憩</span>
        <label class="check">
          <input type="checkbox" id="notify20" />
          20分ごとに目の休憩（20-20-20ルール）を知らせる
        </label>
      </div>

      <div class="section">
        <span class="section-title">サウンド</span>
        <div class="field">
          <span class="field-label">音を出すスピーカー</span>
          <div class="speaker-row">
            <select id="speaker"></select>
            <button id="test-sound" class="btn btn-ghost btn-sm">テスト</button>
          </div>
        </div>
      </div>

      <button id="save" class="btn btn-primary btn-block">保存</button>
    </div>
    <script src="bundle.js" defer></script>
  </body>
</html>
